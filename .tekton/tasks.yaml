apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: cleanup
spec:
  description: Cleans up workspace files before pulling new code
  workspaces:
    - name: source
  steps:
    - name: remove-files
      image: alpine:latest
      workingDir: $(workspaces.source.path)
      script: |
        #!/usr/bin/env sh
        rm -rf *
---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: nose
spec:
  description: Runs unit tests using nose framework
  workspaces:
    - name: source
  steps:
    - name: run-tests
      image: python:3.9-slim
      workingDir: $(workspaces.source.path)
      script: |
        #!/usr/bin/env sh
        pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install nose
        nosetests -v
